- name: Verify supported os
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version | int == 13
    success_msg: "Supported operating system detected: Debian 13"
    fail_msg: >-
      The common role currently supports only Debian 13.
      Detected: {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}

- name: Validate common role variables
  ansible.builtin.assert:
    that:
      - common_hostname is defined
      - common_hostname is string
      - common_hostname is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - common_timezone is string
      - common_timezone | length > 0
      - common_packages is sequence
      - common_extra_packages is sequence
    success_msg: "Common role variables are valid"
    fail_msg: "Common role variables are invalid"

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages + common_extra_packages }}"
    state: present

- name: Configure system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Enable system time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    state: started
    enabled: true
    masked: false

- name: Configure periodic apt updates
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Restrict unattended upgrades to security updates
  ansible.builtin.copy:
    src: 52unattended-upgrades-local
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Enable automatic apt update timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Configure local hostname resolution
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1(?:\s|$)'
    line: "127.0.1.1 {{ common_hostname }}"
    state: present

- name: Configure system hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"