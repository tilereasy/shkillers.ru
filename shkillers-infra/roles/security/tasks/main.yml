---
- name: Validate ssh security variables
  ansible.builtin.assert:
    that:
      - security_ssh_port | int >= 1
      - security_ssh_port | int <= 65535
      - security_ssh_permit_root_login in
        ['no', 'prohibit-password', 'forced-commands-only']
      - security_ssh_pubkey_authentication is boolean
      - security_ssh_password_authentication is boolean
      - security_ssh_kbd_interactive_authentication is boolean
      - security_ssh_x11_forwarding is boolean
      - security_ssh_allow_agent_forwarding is boolean
      - security_ssh_allow_tcp_forwarding is boolean
      - security_ssh_permit_tunnel is boolean
      - security_ssh_max_auth_tries | int >= 1
      - security_ssh_login_grace_time | int >= 1
      - security_ssh_client_alive_interval | int >= 0
      - security_ssh_client_alive_count_max | int >= 0
      - security_ssh_allowed_users is sequence
    success_msg: "ssh security variables are valid"
    fail_msg: "ssh security variables are invalid"

- name: Ensure Openssh server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Ensure Openssh drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Openssh hardening configuration
  ansible.builtin.template:
    src: 00-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload ssh

- name: Validate complete Openssh configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
  when: not ansible_check_mode

- name: Read effective Openssh configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: security_sshd_effective
  changed_when: false
  when: not ansible_check_mode

- name: Verify effective Openssh security settings
  ansible.builtin.assert:
    that:
      - >-
        ('port ' ~ (security_ssh_port | string))
        in security_sshd_effective.stdout_lines
      - >-
        ('permitrootlogin ' ~ security_ssh_permit_root_login)
        in security_sshd_effective.stdout_lines
      - >-
        ('pubkeyauthentication ' ~
        (security_ssh_pubkey_authentication | ternary('yes', 'no')))
        in security_sshd_effective.stdout_lines
      - >-
        ('passwordauthentication ' ~
        (security_ssh_password_authentication | ternary('yes', 'no')))
        in security_sshd_effective.stdout_lines
      - >-
        ('kbdinteractiveauthentication ' ~
        (security_ssh_kbd_interactive_authentication
        | ternary('yes', 'no')))
        in security_sshd_effective.stdout_lines
    success_msg: "Effective Openssh configuration matches the requested policy"
    fail_msg: >-
      Openssh accepted the configuration, but its effective settings
      do not match the requested policy.
  when: not ansible_check_mode

- name: Apply pending Openssh handler
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Reset ansible ssh connection
  ansible.builtin.meta: reset_connection
  when: not ansible_check_mode

- name: Verify ssh connectivity after configuration reload
  ansible.builtin.wait_for_connection:
    timeout: 30
    sleep: 2
  when: not ansible_check_mode