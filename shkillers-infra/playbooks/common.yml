- name: Configure web servers
  hosts: webservers
  gather_facts: true
  become: true
  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version | int == 13
        success_msg: "Supported operating system detected: Debian 13"
        fail_msg: >-
          This playbook currently supports only Debian 13.
          Detected: {{ ansible_facts.distribution }}
          {{ ansible_facts.distribution_version }}

    - name: Validate common configuration variables
      ansible.builtin.assert:
        that:
          - server_hostname is match('^[a-z0-9][a-z0-9-]{0,62}$')
          - server_timezone | length > 0
          - common_packages | length > 0
        success_msg: "Common configuration variables are valid"
        fail_msg: "Common configuration variables are invalid"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
    - name: Configure system timezone
      community.general.timezone:
        name: "{{ server_timezone }}"
    - name: Configure local hostname res
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1(?:\s|$)'
        line: "127.0.1.1 {{ server_hostname }}"
        state: present
    - name: configure system hostname
      ansible.builtin.hostname:
        name: "{{ server_hostname }}"
