- name: Provision web servers
  hosts: webservers
  gather_facts: true
  become: true

  roles:
    - role: common
      tags:
        - common

    - role: security
      tags:
        - security

    - role: nginx
      tags:
        - nginx
    - role: tls
      tags:
        - tls
  
  post_tasks:
    - name: Refresh Nginx virtual host after certificate issuance
      ansible.builtin.include_role:
        name: nginx
        tasks_from: vhost.yml
      tags:
        - nginx
        - tls